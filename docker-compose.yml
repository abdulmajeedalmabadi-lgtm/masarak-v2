services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: masarak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: masarak
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masarak"]
      interval: 5s
      retries: 10
volumes:
  db-data:
